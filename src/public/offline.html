<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00b196" />
    <title>SmartBooks is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f0f7f5;
        color: #0d1f1b;
      }

      main {
        width: min(100%, 460px);
        padding: 38px;
        border: 1px solid #deeee9;
        border-radius: 24px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 24px 70px rgba(13, 31, 27, 0.1);
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: #00b196;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -2px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.65rem, 5vw, 2.1rem);
      }

      p {
        margin: 0 auto 26px;
        max-width: 34ch;
        color: #58736d;
        line-height: 1.6;
      }

      button {
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 14px;
        background: #00b196;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgba(0, 177, 150, 0.35);
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        body { background: #091210; color: #e0f0ec; }
        main { background: #0f1c18; border-color: #1e3530; }
        p { color: #8ec4bb; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">SB</div>
      <h1>You are currently offline</h1>
      <p>
        SmartBooks could not reach the server. Check your connection and try again.
        Financial data is not stored offline.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
